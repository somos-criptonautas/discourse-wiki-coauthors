es:
  theme_metadata:
    description: "Acredita a todas las personas que editaron un post wiki, listadas debajo del propio post."
    settings:
      target_categories: "Categorías cuyos posts wiki muestran la lista de coeditores. Se combina con las etiquetas de abajo como unión."
      target_tags: "Etiquetas cuyos posts wiki muestran la lista de coeditores, en cualquier categoría. Si no se configura ninguna categoría ni etiqueta, se muestra en todos los posts wiki."
      label: "Texto que aparece antes de los nombres de los coeditores. Vacío usa el idioma de quien lee."
      excluded_users: "Usuarios que nunca se acreditan en la lista. Solo es un filtro de visualización: sus ediciones siguen en el historial del post."
      max_avatars: "Cuántos avatares se muestran antes de que el resto pase a un desplegable."
      label_overrides:
        description: "Texto por categoría, que reemplaza la etiqueta de arriba. Las categorías no listadas la conservan."
        schema:
          properties:
            category_ids:
              label: "Categorías"
              description: "Categorías que usan este texto."
            label:
              label: "Texto"
              description: "Texto que aparece antes de los nombres en esas categorías."
  coauthors:
    label: "Coeditado por"
    more:
      one: "+%{count} más"
      other: "+%{count} más"
