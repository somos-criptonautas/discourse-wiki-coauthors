target_categories:
  type: list
  list_type: category
  default: ""

label:
  type: string
  default: ""

excluded_users:
  type: list
  list_type: simple
  default: ""

label_overrides:
  type: objects
  default: []
  schema:
    name: override
    properties:
      category_ids:
        type: categories
        required: true
        validations:
          min: 1
      label:
        type: string
        required: true
        validations:
          min_length: 1

max_avatars:
  type: integer
  default: 5
  min: 1
  max: 20
